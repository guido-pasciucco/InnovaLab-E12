services:
  - type: web
    name: innovalab-backend
    env: docker
    region: oregon
    plan: free
    branch: develop
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
